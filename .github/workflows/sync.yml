name: Sync

on:
  schedule:
    - cron: '0 * * * *'
      timezone: "Europe/Madrid"
  workflow_dispatch:

env:
  DATA_CHANGED: false

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and generate data
        run: python3 src/onionoo_fetch.py
      - name: Sanity check generated data
        run: |
          test -s tor_relays.csv || { echo "tor_relays.csv is empty; aborting"; exit 1; }
          test "$(wc -l < tor_relays.csv)" -gt 1 || { echo "tor_relays.csv has no data rows; aborting"; exit 1; }
      - name: Commit and push if changed
        run: |
          git add tor_relays.csv tor_relays_ips.txt tor_relays_ips_ipv4.txt tor_relays_ips_ipv6.txt
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore: sync tor relay data [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              git pull --rebase
            done
            if [ "$pushed" != "true" ]; then
              echo "::error:: failed to push after 3 attempts"
              exit 1
            fi
            echo "DATA_CHANGED=true" >> "$GITHUB_ENV"
          fi
      - name: Publish release (rolling tag "data")
        env:
          GH_TOKEN: ${{ github.token }}
        if: env.DATA_CHANGED == 'true'
        run: |
          if gh release view data >/dev/null 2>&1; then
            gh release edit data \
              --title "Latest Tor relay data" \
              --notes "Autogenerated from Onionoo (type:relay running:true)."
            gh release upload data \
              --clobber \
              tor_relays.csv tor_relays_ips.txt tor_relays_ips_ipv4.txt tor_relays_ips_ipv6.txt
          else
            gh release create data \
              --title "Latest Tor relay data" \
              --notes "Autogenerated from Onionoo (type:relay running:true)." \
              tor_relays.csv tor_relays_ips.txt tor_relays_ips_ipv4.txt tor_relays_ips_ipv6.txt
          fi